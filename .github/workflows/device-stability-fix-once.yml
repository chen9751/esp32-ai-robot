name: Device stability fix once

on:
  push:
    paths:
      - '.github/workflows/device-stability-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited device page fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('components/ui/ui_page_devices.c')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '#define BATH_DRAG_STEP 12\n',
              '#define BATH_DRAG_STEP 12\n#define GESTURE_LOCK_PX 6\n',
              'gesture lock constant')

          replace_once(
              'typedef struct { lv_obj_t *seg[7]; } digit_t;\n'
              'typedef enum { CENTER_TEMP, CENTER_MODE, CENTER_FAN } center_t;\n',
              'typedef struct { lv_obj_t *seg[7]; } digit_t;\n'
              'typedef enum { CENTER_TEMP, CENTER_MODE, CENTER_FAN } center_t;\n'
              'typedef enum { GESTURE_PENDING, GESTURE_VERTICAL, GESTURE_HORIZONTAL } gesture_axis_t;\n',
              'gesture axis enum')

          replace_once(
              'static center_t center = CENTER_TEMP;\n'
              'static int32_t temp_y;\n',
              'static center_t center = CENTER_TEMP;\n'
              'static int32_t temp_x;\n'
              'static int32_t temp_y;\n'
              'static gesture_axis_t temp_axis = GESTURE_PENDING;\n',
              'aircon gesture state')

          replace_once(
              'static int32_t bath_current_x10 = 240;\n'
              'static int32_t bath_temp_y;\n',
              'static int32_t bath_current_x10 = 240;\n'
              'static int32_t bath_temp_x;\n'
              'static int32_t bath_temp_y;\n'
              'static gesture_axis_t bath_temp_axis = GESTURE_PENDING;\n',
              'bath gesture state')

          replace_once(
              'static void activity(void)\n'
              '{\n'
              '    if(acb) acb(aud);\n'
              '}\n',
              'static void activity(void)\n'
              '{\n'
              '    if(acb) acb(aud);\n'
              '}\n\n'
              'static int32_t iabs32(int32_t v)\n'
              '{\n'
              '    return v < 0 ? -v : v;\n'
              '}\n',
              'absolute helper')

          replace_once(
              '        for(int j = 0; j < 4; ++j) {\n'
              '            checked(v->feat[j], features[j]);\n'
              '            checked(v->mode_b[j], mode_idx == (uint8_t)j);\n'
              '            enabled(v->feat[j], power_on);\n'
              '            enabled(v->mode_b[j], sm);\n'
              '        }\n',
              '        for(int j = 0; j < 4; ++j) {\n'
              '            checked(v->feat[j], features[j]);\n'
              '            checked(v->mode_b[j], mode_idx == (uint8_t)j);\n'
              '            enabled(v->feat[j], power_on);\n'
              '            enabled(v->mode_b[j], sm);\n'
              '            lv_obj_t *feat_label = lv_obj_get_child(v->feat[j], 0);\n'
              '            if(feat_label) lv_obj_set_style_text_color(feat_label, power_on ? FG : DIM, 0);\n'
              '        }\n',
              'disabled feature label color')

          replace_once(
              '''static void temp_cb(lv_event_t *e)\n{
    if(!power_on || center != CENTER_TEMP) return;
    lv_indev_t *i = lv_event_get_indev(e);
    if(!i) return;
    lv_event_code_t c = lv_event_get_code(e);
    lv_point_t p; lv_indev_get_point(i, &p);
    if(c == LV_EVENT_PRESSED) { temp_y = p.y; activity(); return; }
    if(c == LV_EVENT_PRESSING) {
        int32_t dy = p.y - temp_y; bool ch = false;
        while(dy <= -TSTEP && temp2 < TMAX) {
            ++temp2; temp_y -= TSTEP; dy += TSTEP; ch = true;
        }
        while(dy >= TSTEP && temp2 > TMIN) {
            --temp2; temp_y += TSTEP; dy -= TSTEP; ch = true;
        }
        if(ch) refresh_aircon(); activity(); return;
    }
    if(c == LV_EVENT_RELEASED || c == LV_EVENT_PRESS_LOST) activity();
}
''',
              '''static void temp_cb(lv_event_t *e)\n{
    if(!power_on || center != CENTER_TEMP) return;
    lv_indev_t *i = lv_event_get_indev(e);
    if(!i) return;
    lv_event_code_t c = lv_event_get_code(e);
    lv_point_t p; lv_indev_get_point(i, &p);

    if(c == LV_EVENT_PRESSED) {
        temp_x = p.x;
        temp_y = p.y;
        temp_axis = GESTURE_PENDING;
        activity();
        return;
    }

    if(c == LV_EVENT_PRESSING) {
        int32_t dx = p.x - temp_x;
        int32_t dy = p.y - temp_y;

        if(temp_axis == GESTURE_PENDING) {
            int32_t ax = iabs32(dx);
            int32_t ay = iabs32(dy);
            if(ax < GESTURE_LOCK_PX && ay < GESTURE_LOCK_PX) {
                activity();
                return;
            }
            if(ax > ay) {
                temp_axis = GESTURE_HORIZONTAL;
                activity();
                return;
            }
            temp_axis = GESTURE_VERTICAL;
        }

        if(temp_axis == GESTURE_HORIZONTAL) {
            activity();
            return;
        }

        bool ch = false;
        while(dy <= -TSTEP && temp2 < TMAX) {
            ++temp2; temp_y -= TSTEP; dy += TSTEP; ch = true;
        }
        while(dy >= TSTEP && temp2 > TMIN) {
            --temp2; temp_y += TSTEP; dy -= TSTEP; ch = true;
        }
        if(ch) refresh_aircon();
        activity();
        return;
    }

    if(c == LV_EVENT_RELEASED || c == LV_EVENT_PRESS_LOST) {
        temp_axis = GESTURE_PENDING;
        activity();
    }
}
''',
              'aircon gesture direction lock')

          replace_once(
              '''static void bath_temp_cb(lv_event_t *e)\n{
    if(!bath_active()) return;
    lv_indev_t *indev = lv_event_get_indev(e);
    if(!indev) return;
    lv_event_code_t code = lv_event_get_code(e);
    lv_point_t p;
    lv_indev_get_point(indev, &p);

    if(code == LV_EVENT_PRESSED) {
        bath_temp_y = p.y;
        activity();
        return;
    }
    if(code == LV_EVENT_PRESSING) {
        int32_t dy = p.y - bath_temp_y;
        bool changed = false;
        while(dy <= -BATH_DRAG_STEP && bath_target_x10 < BATH_TMAX_X10) {
            bath_target_x10 += BATH_TSTEP_X10;
            bath_temp_y -= BATH_DRAG_STEP;
            dy += BATH_DRAG_STEP;
            changed = true;
        }
        while(dy >= BATH_DRAG_STEP && bath_target_x10 > BATH_TMIN_X10) {
            bath_target_x10 -= BATH_TSTEP_X10;
            bath_temp_y += BATH_DRAG_STEP;
            dy -= BATH_DRAG_STEP;
            changed = true;
        }
        if(changed) refresh_bath();
        activity();
        return;
    }
    if(code == LV_EVENT_RELEASED || code == LV_EVENT_PRESS_LOST) activity();
}
''',
              '''static void bath_temp_cb(lv_event_t *e)\n{
    if(!bath_active()) return;
    lv_indev_t *indev = lv_event_get_indev(e);
    if(!indev) return;
    lv_event_code_t code = lv_event_get_code(e);
    lv_point_t p;
    lv_indev_get_point(indev, &p);

    if(code == LV_EVENT_PRESSED) {
        bath_temp_x = p.x;
        bath_temp_y = p.y;
        bath_temp_axis = GESTURE_PENDING;
        activity();
        return;
    }

    if(code == LV_EVENT_PRESSING) {
        int32_t dx = p.x - bath_temp_x;
        int32_t dy = p.y - bath_temp_y;

        if(bath_temp_axis == GESTURE_PENDING) {
            int32_t ax = iabs32(dx);
            int32_t ay = iabs32(dy);
            if(ax < GESTURE_LOCK_PX && ay < GESTURE_LOCK_PX) {
                activity();
                return;
            }
            if(ax > ay) {
                bath_temp_axis = GESTURE_HORIZONTAL;
                activity();
                return;
            }
            bath_temp_axis = GESTURE_VERTICAL;
        }

        if(bath_temp_axis == GESTURE_HORIZONTAL) {
            activity();
            return;
        }

        bool changed = false;
        while(dy <= -BATH_DRAG_STEP && bath_target_x10 < BATH_TMAX_X10) {
            bath_target_x10 += BATH_TSTEP_X10;
            bath_temp_y -= BATH_DRAG_STEP;
            dy += BATH_DRAG_STEP;
            changed = true;
        }
        while(dy >= BATH_DRAG_STEP && bath_target_x10 > BATH_TMIN_X10) {
            bath_target_x10 -= BATH_TSTEP_X10;
            bath_temp_y += BATH_DRAG_STEP;
            dy -= BATH_DRAG_STEP;
            changed = true;
        }
        if(changed) refresh_bath();
        activity();
        return;
    }

    if(code == LV_EVENT_RELEASED || code == LV_EVENT_PRESS_LOST) {
        bath_temp_axis = GESTURE_PENDING;
        activity();
    }
}
''',
              'bath gesture direction lock')

          replace_once(
              '    acb = cb; aud = ud; wrapping = false; updating = false;\n'
              '    aircon_view_n = 0; curtain_view_n = 0; bath_view_n = 0; drying_view_n = 0;\n',
              '    acb = cb; aud = ud; wrapping = false; updating = false;\n'
              '    temp_axis = GESTURE_PENDING; bath_temp_axis = GESTURE_PENDING;\n'
              '    aircon_view_n = 0; curtain_view_n = 0; bath_view_n = 0; drying_view_n = 0;\n',
              'build gesture reset')

          replace_once(
              '    root = NULL; pager = NULL; wrapping = false; updating = false;\n'
              '    aircon_view_n = 0; curtain_view_n = 0; bath_view_n = 0; drying_view_n = 0;\n',
              '    root = NULL; pager = NULL; wrapping = false; updating = false;\n'
              '    temp_axis = GESTURE_PENDING; bath_temp_axis = GESTURE_PENDING;\n'
              '    aircon_view_n = 0; curtain_view_n = 0; bath_view_n = 0; drying_view_n = 0;\n',
              'stop gesture reset')

          path.write_text(s)
          PY

          rm .github/workflows/device-stability-fix-once.yml

      - name: Commit stability fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ui/ui_page_devices.c .github/workflows/device-stability-fix-once.yml
          git commit -m "Fix device page stability issues"
          git push origin HEAD:main
