name: Device stability fix once

on:
  push:
    paths:
      - '.github/workflows/device-stability-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited device page fixes
        run: python3 tools/apply_device_stability_fix_once.py

      - name: Remove one-shot helpers
        run: |
          rm .github/workflows/device-stability-fix-once.yml
          rm tools/apply_device_stability_fix_once.py

      - name: Commit stability fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ui/ui_page_devices.c .github/workflows/device-stability-fix-once.yml tools/apply_device_stability_fix_once.py
          git commit -m "Fix device page stability issues"
          git push origin HEAD:main
