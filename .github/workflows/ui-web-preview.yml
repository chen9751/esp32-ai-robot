name: UI Web Preview
on:
  push:
    branches: [main]
    paths: ["components/ui/**","web_preview/**","tools/generate_alarm_font.sh","tools/generate_lights_font.sh","tools/generate_lights_icons.py","tools/generate_timer_asset.py","tools/check_ui_icon_policy.py",".github/workflows/ui-web-preview.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce UI icon policy
        run: python3 tools/check_ui_icon_policy.py
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.15"
          actions-cache-folder: emsdk-cache
      - name: Generate Source Han alarm font subset
        run: bash tools/generate_alarm_font.sh
      - name: Generate Source Han Lights font subset
        run: bash tools/generate_lights_font.sh
      - name: Generate antialiased Remix Icon Lights assets
        run: |
          python -m pip install --quiet pillow cairosvg numpy
          python tools/generate_lights_icons.py
      - name: Generate timer HOME asset
        run: python tools/generate_timer_asset.py
      - name: Configure
        run: emcmake cmake -S web_preview -B web_preview/build -DCMAKE_BUILD_TYPE=Release
      - name: Build LVGL WebAssembly preview
        run: cmake --build web_preview/build -j2
      - name: Commit generated UI assets
        run: |
          if [ -n "$(git status --porcelain -- components/ui/ui_font_source_han_alarm_16.c components/ui/ui_font_source_han_lights_18.c components/ui/ui_lights_icons.c components/ui/ui_asset_timer.c)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add components/ui/ui_font_source_han_alarm_16.c components/ui/ui_font_source_han_lights_18.c components/ui/ui_lights_icons.c components/ui/ui_asset_timer.c
            git commit -m "Regenerate approved UI assets"
            git push
          fi
      - name: Prepare Pages artifact
        run: |
          mkdir -p web_preview/dist
          cp web_preview/build/index.html web_preview/dist/
          cp web_preview/build/index.js web_preview/dist/
          cp web_preview/build/index.wasm web_preview/dist/
          touch web_preview/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web_preview/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
