name: UI Web Preview
on:
  push:
    branches: [main, "ui/**"]
    paths: ["components/ui/**","web_preview/**",".github/workflows/ui-web-preview.yml"]
  pull_request:
    branches: [main]
    paths: ["components/ui/**","web_preview/**",".github/workflows/ui-web-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.15"
          actions-cache-folder: emsdk-cache
      - name: Configure
        run: emcmake cmake -S web_preview -B web_preview/build -DCMAKE_BUILD_TYPE=Release
      - name: Build LVGL WebAssembly preview
        run: cmake --build web_preview/build -j2
      - name: Prepare Pages artifact
        run: |
          mkdir -p web_preview/dist
          cp web_preview/build/index.html web_preview/dist/
          cp web_preview/build/index.js web_preview/dist/
          cp web_preview/build/index.wasm web_preview/dist/
          touch web_preview/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web_preview/dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy current UI branch to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
