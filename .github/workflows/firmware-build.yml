name: ESP-IDF Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "main/**"
      - "components/**"
      - "sdkconfig.defaults"
      - "CMakeLists.txt"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ESP32-S3 firmware with ESP-IDF 5.5.4
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: "."
          command: idf.py build

      - name: Upload flashable firmware package
        uses: actions/upload-artifact@v4
        with:
          name: esp32-ai-robot-firmware
          if-no-files-found: error
          retention-days: 14
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flasher_args.json
            build/flash_args
