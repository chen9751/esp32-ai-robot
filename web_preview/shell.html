<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ESP32 AI Robot · LVGL Preview</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#eef3fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{position:fixed;inset:0}.page{position:absolute;inset:0}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.device{background:#111722;border:1px solid #293548;border-radius:22px;padding:10px;box-shadow:0 20px 60px #0008;box-sizing:border-box}
canvas{display:block;background:#06080d;border-radius:12px;touch-action:none;max-width:none}
.badge{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:5;padding:6px 9px;border-radius:10px;background:#111722cc;border:1px solid #293548;color:#8390a3;font-size:11px;pointer-events:none}
</style></head><body><main class="page"><div class="badge" id="badge">LVGL · 640×172</div><div class="stage"><div class="device"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div></div></main>
<script>
var Module={canvas:document.getElementById('canvas')};
const device=document.querySelector('.device'),badge=document.getElementById('badge');
let logicalW=640,logicalH=172;
function fit(w,h){
 logicalW=w;logicalH=h;badge.textContent='LVGL · '+w+'×'+h;
 const vw=window.innerWidth,vh=window.innerHeight;
 const portrait=vh>vw;
 const rotate=portrait;
 const availW=(rotate?vh:vw)-28,availH=(rotate?vw:vh)-28;
 const scale=Math.min(2.4,availW/w,availH/h);
 const sw=w*scale,sh=h*scale;
 const c=Module.canvas;c.style.width=sw+'px';c.style.height=sh+'px';
 device.style.width=(sw+22)+'px';device.style.height=(sh+22)+'px';
 device.style.transform=rotate?'rotate(90deg)':'none';
 c.dataset.rotated=rotate?'1':'0';
}
window.robotPreviewResize=function(w,h){const c=Module.canvas;c.width=w;c.height=h;fit(w,h)};
window.addEventListener('resize',()=>fit(logicalW,logicalH));
window.addEventListener('orientationchange',()=>setTimeout(()=>fit(logicalW,logicalH),120));
function mapPointer(e){
 if(device.dataset.rotated!=='1') return;
 const c=Module.canvas, rect=c.getBoundingClientRect();
 const touch=e.touches&&e.touches[0]?e.touches[0]:e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e;
 if(touch.clientX==null)return;
 // Canvas is visually rotated 90deg clockwise. Convert viewport point back
 // into the canvas' unrotated coordinate system before SDL receives it.
 const x=(touch.clientY-rect.top)/rect.height*c.width;
 const y=(rect.right-touch.clientX)/rect.width*c.height;
 const cx=Math.max(0,Math.min(c.width-1,x));
 const cy=Math.max(0,Math.min(c.height-1,y));
 const ev=new PointerEvent(e.type==='touchend'?'pointerup':e.type==='touchstart'?'pointerdown':'pointermove',{
   clientX:rect.left+(cx/c.width)*rect.width,
   clientY:rect.top+(cy/c.height)*rect.height,
   bubbles:true,pointerType:'touch',isPrimary:true
 });
 c.dispatchEvent(ev);
}
['touchstart','touchmove','touchend'].forEach(t=>document.querySelector('.stage').addEventListener(t,e=>{
 if(device.dataset.rotated==='1'){e.preventDefault();mapPointer(e);}
},{passive:false}));
fit(640,172);
</script>{{{ SCRIPT }}}</body></html>
