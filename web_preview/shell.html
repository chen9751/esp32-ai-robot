<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ESP32 AI Robot · LVGL Preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}body{position:fixed;inset:0}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.device{background:#111722;border:1px solid #293548;border-radius:22px;padding:10px;box-shadow:0 20px 60px #0008;box-sizing:border-box}canvas{display:block;background:#06080d;border-radius:12px;touch-action:none;max-width:none}.rotate-test{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;border:1px solid #3a4659;background:#161d29;color:#eaf2ff;border-radius:999px;padding:9px 14px;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 8px 30px #0008;cursor:pointer;-webkit-tap-highlight-color:transparent}.rotate-test:disabled{opacity:.42;cursor:default}.rotate-test.active{background:#24344d}</style></head><body><div class="stage"><div class="device"><canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div></div><button id="rotateTest" class="rotate-test" disabled>↺ 图标 90°</button><script>const c=document.getElementById('canvas'),device=document.querySelector('.device'),rotateTest=document.getElementById('rotateTest');var Module={canvas:c,onRuntimeInitialized(){rotateTest.disabled=false}};function fit(){const available=Math.min((innerWidth-44)/640,(innerHeight-44)/172);const scale=available>=2?2:available>=1?1:available;const w=640*scale,h=172*scale;c.style.width=w+'px';c.style.height=h+'px';device.style.width=(w+22)+'px';device.style.height=(h+22)+'px'}rotateTest.addEventListener('click',()=>{if(!Module._web_toggle_remote_rotation)return;const active=Module._web_toggle_remote_rotation()===1;rotateTest.classList.toggle('active',active);rotateTest.textContent=active?'↻ 恢复图标':'↺ 图标 90°'});addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));fit();</script>{{{ SCRIPT }}}</body></html>
